[workspace]
members = ["crates/tfm-core", "crates/tfm-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/tfm-git/tfm"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
gix = { version = "=0.86.0", default-features = false, features = ["sha1", "status"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tokio = { version = "1.53.0", features = ["io-util", "macros", "process", "rt-multi-thread", "time"] }
wasmtime = { version = "=48.0.0", features = ["component-model-async"] }
wasmtime-wasi = { version = "=48.0.0", features = ["p3"] }
